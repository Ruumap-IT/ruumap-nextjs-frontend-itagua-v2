<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Itaguav3 - Sin conexión</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #161514;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            text-align: center;
        }
        .container {
            max-width: 300px;
            padding: 20px;
        }
        h1 {
            font-size: 1.2rem;
            font-weight: 300;
            letter-spacing: 1px;
            margin-bottom: 8px;
            text-transform: uppercase;
        }
        p {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.5);
            line-height: 1.5;
        }
        .btn {
            margin-top: 24px;
            padding: 12px 24px;
            background-color: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.85rem;
            transition: all 0.2s ease;
        }
        .btn:active {
            background-color: rgba(255, 255, 255, 0.2);
            transform: scale(0.98);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Sin conexión</h1>
        <p>Itaguav3 requiere internet para cargar esta sección. Una vez sincronizada, estará disponible sin conexión.</p>
        <a href="/" class="btn">Volver al inicio</a>
    </div>
</body>
</html>
